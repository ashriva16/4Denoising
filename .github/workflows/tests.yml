# Runs the test suite on every push and pull request, on CPU (no GPU needed:
# the tests use synthetic data and tiny scans).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}${{ matrix.extras && ', optional readers' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        extras: [false]
        include:
          - os: ubuntu-latest
            extras: true            # RosettaSciIO + HyperSpy round trip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install (CPU PyTorch + runtime dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r docker/requirements.txt pytest

      - name: Install optional readers
        if: matrix.extras
        run: pip install rosettasciio hyperspy

      - name: Run tests
        run: python -m pytest tests -ra
