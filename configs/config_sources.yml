# Training on several datasets at once (see core/data_setup.py).
# Same model / train / output sections as config.yml; `dataset` differs and
# `defects` is new.
#
#   python -m scripts.make_defect_mask --config configs/config_sources.yml --plot mask.png
#   python -m scripts.train --config configs/config_sources.yml
#   python -m scripts.infer --config configs/config_sources.yml --checkpoint <ckpt> --source A

dataset:
  sources:                             # paths relative to where you run the command
    - path: data/example/scan_A_master.h5
      scan_shape: [500, 1000]          # ARINA and MIB files do not store it
      crop_y: [200, 300]               # optional per-source scan crop
      crop_x: [450, 550]
      label: A
    - path: data/example/scan_B_master.h5
      scan_shape: [500, 1000]
      crop_y: [200, 300]
      crop_x: [450, 550]
      label: B
    # an already-binned file (e.g. a cache written by another workflow):
    # - path: data/example/cache.h5
    #   reader_options: {key: series/data, index: 0}
    #   prebinned: {q_bin: 2, r_bin: 8}    # binning applied before it was written
  fmt: auto                            # arina / h5 / npy / rsciio:<plugin> / auto
  q_bin: 2                             # detector binning, counts summed
  r_bin: 1                             # scan binning, counts summed
  scan_mask:                           # which positions are training targets
    mode: all                          # all / corner / diagonal / checkerboard / file
  neighbor_mode: alternating_spatial
  offset: 0
  domain_policy: strict                # weights from other binning/offset: strict / warn / off
  defect_mask_file: masks/detector_mask.h5   # built by scripts.make_defect_mask;
                                             # applied at full detector size, before binning
  # without a mask file, the original post-binning detection can be used instead:
  # defect_mask: true
  # defect_method: combined
  # defect_sigma: 2.5
  # defect_correction: median_local
  image_size: null

defects:                               # read by scripts.make_defect_mask only
  output: masks/detector_mask.h5
  reference:                           # frames the mask is computed from
    source: A                          # label or index in dataset.sources, or a path
    crop_y: [150, 350]                 # defaults to that source's crop
    crop_x: [400, 600]
  detectors:                           # union; types listed in core/defects.py
    - {type: hot, factor: 3.0}
    - {type: dead, min_frac: 0.02}
    # - {type: py4dstem_hot, thresh: 0.3, ind_compare: 5}
    # - {type: lines, rows: [], cols: [96]}
    # - {type: pixels, coords: [[10, 12]]}
  inpaint: {max_radius: 4, min_donors: 3}

model:
  weights: null                        # null = train from scratch; or a checkpoint to start from
  name: blind-video-net-5d-cross
  unet: original
  channels: 1
  out_channels: 1
  bias: false
  normal: false
  blind_noise: false

train:
  lr: 1.0e-4
  loss: poisson_nll
  scheduler: multistep
  num_epochs: 50
  batch_size: 4
  val_split: 0.15
  seed: 314
  milestones: [15, 30, 40]
  gamma: 0.5
  checkpoint: 1
  num_workers: 0
  # trainable: [nin_A, nin_B, nin_C]   # with weights: train only these layers

output:
  save_dir: checkpoints/example
