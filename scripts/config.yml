dataset:
  data_dir: data
  file: sample.hdf5
  neighbor_mode: alternating_spatial   # NEW
  bin_factor: 2                        # NEW: 1 = no binning
  offset: 0                            # NEW: 0 = no counts offset
  defect_mask: true                    # NEW
  defect_sigma: 2.5                    # NEW
  image_size: null                     # NEW: null = no crop

model:
  name: blind-video-net-5d-cross       # 9ch, 4 groups, shift2
  unet: original                       # NEW: original/blur/deep/deep_blur
  channels: 1
  out_channels: 1
  bias: false
  normal: false
  blind_noise: false

train:
  lr: 1.0e-4
  loss: poisson_nll                    # NEW: mse/log_mse/poisson_nll/weighted_poisson_nll
  scheduler: cosine                    # NEW: multistep or cosine
  num_epochs: 50
  batch_size: 4
  val_split: 0.15
  seed: 314
  milestones: [15, 30, 40]
  gamma: 0.5
  checkpoint: 1
  num_workers: 0                       # NEW

output:
  save_dir: checkpoints/exp01
