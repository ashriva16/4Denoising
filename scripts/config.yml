dataset:
  data_dir: data
  file: TiO2_002.hdf5
  crop_N: 0                            # detector edge crop (null = none)  
  neighbor_mode: alternating_spatial   # alternating_spatial / alternating_temporal / spatial / temporal
  bin_factor: 2                        # NxN, 1 = no binning
  upsample_factor: 2                   # NxN bicubic, 1 = no upsampling
  offset: 0                            # 0 = no counts offset
  defect_mask: true
  defect_method: combined              # statistical / zero_count / combined
  defect_sigma: 2.5
  defect_correction: median_local      # median_local / interpolate
  image_size: null                     # null = no crop

model:
  name: blind-video-net-5d-cross       # 9ch, 4 groups, shift2
  unet: original                       # original/blur/deep/deep_blur
  channels: 1
  out_channels: 1
  bias: false
  normal: false
  blind_noise: false

train:
  lr: 1.0e-4
  loss: poisson_nll                    # mse / log_mse / poisson_nll / weighted_poisson_nll
  scheduler: cosine                    # multistep / cosine
  num_epochs: 6
  batch_size: 4
  val_split: 0.15
  seed: 314
  milestones: [15, 30, 40]
  gamma: 0.5
  checkpoint: 1
  num_workers: 0

output:
  
  save_dir: checkpoints/TiO2/002
